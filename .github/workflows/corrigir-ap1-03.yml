name: Correção — AP1-03

# Roda automaticamente quando um PR muda arquivos dentro de ap1-03/
# (fluxo de entrega: aluno faz fork, edita o código, abre um PR de volta
# para este repositório). Também pode ser rodado manualmente pela aba
# "Actions" → "Correção — AP1-03" → "Run workflow" (workflow_dispatch),
# sem depender de nenhum PR.
on:
  pull_request:
    branches: [main]
    paths:
      - "ap1-03/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  corrigir:
    name: Corrigir AP1-03 (Questões 5 e 6)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do Pull Request
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar correção automática — AP1-03
        run: node scripts/corrigir-ap1-03.mjs
